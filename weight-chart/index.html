<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>體重趨勢</title>
<style>
  .viz-root {
    color-scheme: light;
    --page:            #f9f9f7;
    --surface-1:       #fcfcfb;
    --text-primary:    #0b0b0b;
    --text-secondary:  #52514e;
    --text-muted:      #898781;
    --gridline:        #e1e0d9;
    --baseline:        #c3c2b7;
    --border:          rgba(11,11,11,0.10);
    --series-1:        #2a78d6;
    --tooltip-bg:       #0b0b0b;
    --tooltip-text:     #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --page:            #0d0d0d;
      --surface-1:       #1a1a19;
      --text-primary:    #ffffff;
      --text-secondary:  #c3c2b7;
      --text-muted:      #898781;
      --gridline:        #2c2c2a;
      --baseline:        #383835;
      --border:          rgba(255,255,255,0.10);
      --series-1:        #3987e5;
      --tooltip-bg:       #ffffff;
      --tooltip-text:     #0b0b0b;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --page:            #0d0d0d;
    --surface-1:       #1a1a19;
    --text-primary:    #ffffff;
    --text-secondary:  #c3c2b7;
    --text-muted:      #898781;
    --gridline:        #2c2c2a;
    --baseline:        #383835;
    --border:          rgba(255,255,255,0.10);
    --series-1:        #3987e5;
    --tooltip-bg:       #ffffff;
    --tooltip-text:     #0b0b0b;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--page);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    color: var(--text-primary);
  }
  .viz-root { padding: 20px; }
  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px 16px;
    max-width: 900px;
    margin: 0 auto;
  }
  h1 {
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 4px;
    color: var(--text-primary);
  }
  .subtitle {
    font-size: 13px;
    color: var(--text-secondary);
    margin: 0 0 2px;
  }
  .updated {
    font-size: 12px;
    color: var(--text-muted);
    margin: 0 0 14px;
  }
  .toolbar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 4px;
  }
  button.toggle {
    font: inherit;
    font-size: 12px;
    color: var(--text-secondary);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
  }
  button.toggle:hover {
    color: var(--text-primary);
    border-color: var(--baseline);
  }
  .chart-wrap {
    position: relative;
  }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .gridline { stroke: var(--gridline); stroke-width: 1; }
  .baseline { stroke: var(--baseline); stroke-width: 1; }
  .ytick, .xtick {
    fill: var(--text-muted);
    font-size: 11px;
  }
  .series-line {
    fill: none;
    stroke: var(--series-1);
    stroke-width: 2;
    stroke-linejoin: round;
    stroke-linecap: round;
  }
  .series-line.gap {
    stroke-dasharray: 4 4;
    opacity: 0.7;
  }
  .end-dot {
    fill: var(--series-1);
    stroke: var(--surface-1);
    stroke-width: 2;
  }
  .end-label {
    font-size: 13px;
    font-weight: 600;
    fill: var(--text-primary);
  }
  .hover-dot {
    fill: var(--series-1);
    stroke: var(--surface-1);
    stroke-width: 2;
  }
  .crosshair {
    stroke: var(--baseline);
    stroke-width: 1;
    stroke-dasharray: 3 3;
  }
  .hit-layer { fill: transparent; cursor: crosshair; }
  .tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--tooltip-bg);
    color: var(--tooltip-text);
    font-size: 12px;
    line-height: 1.5;
    padding: 6px 10px;
    border-radius: 6px;
    transform: translate(-50%, -100%);
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.1s;
    z-index: 5;
  }
  .tooltip .tt-value { font-weight: 700; font-size: 13px; }
  .tooltip .tt-date { color: var(--text-muted); }
  :root[data-theme="dark"] .tooltip .tt-date,
  :root:where(:not([data-theme="light"])) .tooltip .tt-date { color: #6b6a63; }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .tooltip .tt-date { color: #6b6a63; }
  }

  table.data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  table.data-table th, table.data-table td {
    text-align: left;
    padding: 4px 8px;
    border-bottom: 1px solid var(--gridline);
  }
  table.data-table th {
    color: var(--text-muted);
    font-weight: 500;
    position: sticky;
    top: 0;
    background: var(--surface-1);
  }
  .table-scroll {
    max-height: 320px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .note {
    font-size: 12px;
    color: var(--text-muted);
    margin: 12px 0 0;
    line-height: 1.6;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="viz-root">
  <div class="card">
    <h1>體重趨勢</h1>
    <p class="subtitle" id="subtitleText">載入中…</p>
    <p class="updated" id="updatedText"></p>

    <div class="toolbar">
      <button class="toggle" id="toggleView">切換成表格檢視</button>
    </div>

    <div class="chart-wrap">
      <svg id="chart" viewBox="0 0 900 340" role="img" aria-label="體重趨勢折線圖"></svg>
      <div class="tooltip" id="tooltip"></div>
    </div>

    <div id="tableView" hidden>
      <div class="table-scroll">
        <table class="data-table">
          <thead><tr><th>日期</th><th>體重（kg）</th></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

    <p class="note" id="noteText"></p>
  </div>
</div>

<script>
(function () {
  const svg = document.getElementById('chart');
  const tooltip = document.getElementById('tooltip');
  const subtitleText = document.getElementById('subtitleText');
  const updatedText = document.getElementById('updatedText');
  const noteText = document.getElementById('noteText');
  const toggleBtn = document.getElementById('toggleView');
  const tableView = document.getElementById('tableView');
  const tableBody = document.getElementById('tableBody');

  const NS = 'http://www.w3.org/2000/svg';
  const M = { top: 20, right: 24, bottom: 34, left: 46 };
  const W = 900, H = 340;
  const plotW = W - M.left - M.right;
  const plotH = H - M.top - M.bottom;
  const GAP_DAYS_DASH = 10; // 超過這麼多天沒量,線段改虛線表示中間是內插,不是每天量測

  function el(tag, attrs) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  function dayNum(dateStr) {
    return Date.parse(dateStr + 'T00:00:00Z') / 86400000;
  }

  function niceStep(range) {
    // pick a "nice" tick step for the given numeric range, aiming for ~5-6 ticks
    const raw = range / 5;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const norm = raw / mag;
    let step;
    if (norm < 1.5) step = 1;
    else if (norm < 3) step = 2;
    else if (norm < 7) step = 5;
    else step = 10;
    return step * mag;
  }

  function render(data) {
    const points = data.points;
    if (!points || points.length === 0) {
      subtitleText.textContent = '目前沒有資料。';
      return;
    }

    const first = points[0], last = points[points.length - 1];
    const weights = points.map(p => p.weight);
    const minW = Math.min(...weights);
    const maxW = Math.max(...weights);

    subtitleText.textContent =
      `${first.date} 至 ${last.date}，共 ${points.length} 筆紀錄`;

    let updatedStr = '';
    if (data.generated_at) {
      updatedStr = '資料由 GitHub Actions 每日自動從 Notion 同步，最後更新：' +
        data.generated_at.replace('T', ' ').replace('Z', ' UTC');
    }
    updatedText.textContent = updatedStr;

    noteText.textContent =
      `折線圖只畫「有記錄體重的日子」；兩次記錄間隔超過 ${GAP_DAYS_DASH} 天時，` +
      `該段線改成虛線，提醒中間是內插、不是每天都量。目前最新一筆：${last.date}　` +
      `${last.weight.toFixed(1)} kg。右上角「切換成表格檢視」可以看到所有原始數字。`;

    // ---- scales ----
    const t0 = dayNum(first.date), t1 = dayNum(last.date);
    const tSpan = Math.max(1, t1 - t0);
    const xScale = (dateStr) => M.left + ((dayNum(dateStr) - t0) / tSpan) * plotW;

    const pad = Math.max(1, (maxW - minW) * 0.15);
    let yMin = Math.floor((minW - pad) * 2) / 2;
    let yMax = Math.ceil((maxW + pad) * 2) / 2;
    if (yMax - yMin < 2) { yMax += 1; yMin -= 1; }
    const yStep = niceStep(yMax - yMin);
    yMin = Math.floor(yMin / yStep) * yStep;
    yMax = Math.ceil(yMax / yStep) * yStep;
    const yScale = (w) => M.top + plotH - ((w - yMin) / (yMax - yMin)) * plotH;

    // ---- clear ----
    while (svg.firstChild) svg.removeChild(svg.firstChild);

    // ---- y gridlines + labels ----
    for (let v = yMin; v <= yMax + 1e-6; v += yStep) {
      const y = yScale(v);
      svg.appendChild(el('line', {
        x1: M.left, x2: W - M.right, y1: y, y2: y, class: 'gridline'
      }));
      const t = el('text', { x: M.left - 8, y: y + 4, class: 'ytick', 'text-anchor': 'end' });
      t.textContent = (Math.round(v * 10) / 10).toString();
      svg.appendChild(t);
    }

    // ---- baseline (bottom axis) ----
    svg.appendChild(el('line', {
      x1: M.left, x2: W - M.right, y1: M.top + plotH, y2: M.top + plotH, class: 'baseline'
    }));

    // ---- x ticks: 1st of each month in range ----
    const ticks = [];
    const firstD = new Date(first.date + 'T00:00:00Z');
    const cursor = new Date(Date.UTC(firstD.getUTCFullYear(), firstD.getUTCMonth(), 1));
    const lastD = new Date(last.date + 'T00:00:00Z');
    while (cursor <= lastD) {
      const iso = cursor.toISOString().slice(0, 10);
      if (dayNum(iso) >= t0 - 1) ticks.push(iso.slice(0, 7));
      cursor.setUTCMonth(cursor.getUTCMonth() + 1);
    }
    const tickStride = ticks.length > 12 ? 2 : 1;
    ticks.forEach((ym, i) => {
      if (i % tickStride !== 0) return;
      const iso = ym + '-01';
      const x = xScale(iso);
      if (x < M.left - 1 || x > W - M.right + 1) return;
      const t = el('text', { x: x, y: M.top + plotH + 18, class: 'xtick', 'text-anchor': 'middle' });
      t.textContent = ym;
      svg.appendChild(t);
    });

    // ---- line segments (split + dash on big gaps) ----
    const MS_DAY = 1;
    for (let i = 0; i < points.length - 1; i++) {
      const a = points[i], b = points[i + 1];
      const gapDays = dayNum(b.date) - dayNum(a.date);
      const path = el('path', {
        d: `M ${xScale(a.date)} ${yScale(a.weight)} L ${xScale(b.date)} ${yScale(b.weight)}`,
        class: gapDays > GAP_DAYS_DASH ? 'series-line gap' : 'series-line'
      });
      svg.appendChild(path);
    }

    // ---- end dot + label ----
    const lastX = xScale(last.date), lastY = yScale(last.weight);
    svg.appendChild(el('circle', { cx: lastX, cy: lastY, r: 4, class: 'end-dot' }));
    const labelText = `${last.weight.toFixed(1)} kg`;
    const labelX = Math.min(lastX + 8, W - M.right - 2);
    const labelAnchor = (lastX + 8 + labelText.length * 6.5 > W - M.right) ? 'end' : 'start';
    const lt = el('text', {
      x: labelAnchor === 'end' ? lastX - 8 : labelX,
      y: lastY - 10,
      class: 'end-label',
      'text-anchor': labelAnchor
    });
    lt.textContent = labelText;
    svg.appendChild(lt);

    // ---- hover layer ----
    const hitRect = el('rect', {
      x: M.left, y: M.top, width: plotW, height: plotH, class: 'hit-layer'
    });
    const crosshair = el('line', { class: 'crosshair', y1: M.top, y2: M.top + plotH, x1: 0, x2: 0 });
    crosshair.style.display = 'none';
    const hoverDot = el('circle', { r: 5, class: 'hover-dot' });
    hoverDot.style.display = 'none';
    svg.appendChild(crosshair);
    svg.appendChild(hoverDot);
    svg.appendChild(hitRect);

    function nearestIndex(dayVal) {
      // binary search over points by day number
      let lo = 0, hi = points.length - 1;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (dayNum(points[mid].date) < dayVal) lo = mid + 1; else hi = mid;
      }
      if (lo > 0) {
        const dPrev = Math.abs(dayNum(points[lo - 1].date) - dayVal);
        const dCur = Math.abs(dayNum(points[lo].date) - dayVal);
        if (dPrev < dCur) return lo - 1;
      }
      return lo;
    }

    function showHover(clientX) {
      const rect = svg.getBoundingClientRect();
      const svgX = ((clientX - rect.left) / rect.width) * W;
      const dayVal = t0 + ((svgX - M.left) / plotW) * tSpan;
      const idx = nearestIndex(dayVal);
      const p = points[idx];
      const px = xScale(p.date), py = yScale(p.weight);

      crosshair.setAttribute('x1', px);
      crosshair.setAttribute('x2', px);
      crosshair.style.display = '';
      hoverDot.setAttribute('cx', px);
      hoverDot.setAttribute('cy', py);
      hoverDot.style.display = '';

      const wrapRect = svg.parentElement.getBoundingClientRect();
      const scale = wrapRect.width / W;
      tooltip.style.left = (M.left + (px - M.left)) * scale + 'px';
      tooltip.style.top = (py * scale) - 6 + 'px';
      tooltip.innerHTML = '';
      const dEl = document.createElement('div');
      dEl.className = 'tt-date';
      dEl.textContent = p.date;
      const vEl = document.createElement('div');
      vEl.className = 'tt-value';
      vEl.textContent = p.weight.toFixed(1) + ' kg';
      tooltip.appendChild(dEl);
      tooltip.appendChild(vEl);
      tooltip.style.opacity = '1';
    }

    function hideHover() {
      crosshair.style.display = 'none';
      hoverDot.style.display = 'none';
      tooltip.style.opacity = '0';
    }

    hitRect.addEventListener('pointermove', (e) => showHover(e.clientX));
    hitRect.addEventListener('pointerleave', hideHover);
    hitRect.addEventListener('touchmove', (e) => {
      if (e.touches[0]) showHover(e.touches[0].clientX);
    }, { passive: true });
    hitRect.addEventListener('touchend', hideHover);

    // ---- table view ----
    tableBody.innerHTML = '';
    const frag = document.createDocumentFragment();
    for (let i = points.length - 1; i >= 0; i--) {
      const tr = document.createElement('tr');
      const tdDate = document.createElement('td');
      tdDate.textContent = points[i].date;
      const tdW = document.createElement('td');
      tdW.textContent = points[i].weight.toFixed(1);
      tr.appendChild(tdDate);
      tr.appendChild(tdW);
      frag.appendChild(tr);
    }
    tableBody.appendChild(frag);
  }

  toggleBtn.addEventListener('click', () => {
    const showingTable = !tableView.hidden;
    if (showingTable) {
      tableView.hidden = true;
      svg.parentElement.style.display = '';
      toggleBtn.textContent = '切換成表格檢視';
    } else {
      tableView.hidden = false;
      svg.parentElement.style.display = 'none';
      toggleBtn.textContent = '切換成圖表檢視';
    }
  });

  fetch('data.json', { cache: 'no-store' })
    .then(r => r.json())
    .then(render)
    .catch(err => {
      subtitleText.textContent = '資料載入失敗，請稍後重新整理。';
      console.error(err);
    });
})();
</script>
</body>
</html>
